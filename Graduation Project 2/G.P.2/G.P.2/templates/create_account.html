<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Create account-MedAnalyzer System</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Caveat:wght@400..700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="https://img.freepik.com/free-vector/add-new-user_78370-4710.jpg">
        <link rel="stylesheet" href="{{ url_for('static', filename='create_account.css') }}">
        <script src="{{ url_for('static', filename='main.js') }}" defer></script>
         <script src="{{ url_for('static', filename='create_account.js') }}" defer></script>
    </head>
    </head>
    <body>
        <div class="container">
            <h1>Create Your Account</h1>
            <p class="p1">Please fill out the information below to create an account for accessing the MedAnalyzer system.</p>
            <form action="{{ url_for('register') }}" method="post">
            <label for="email">Email:</label>
             <input type="email" id="email" name="email" placeholder="Enter your email" required>

              <label for="password">Password:</label>
             <input type="password" id="password" name="password" placeholder="Enter your password" required>

             <label for="confirm-password">Confirm Password:</label>
             <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>

             <label for="role">Role:</label>
             <select id="role" name="role" required>
                <option value="doctor">Doctor</option>
                <option value="Nurse">Nurse</option>
                <option value="patient">Patient</option>
               </select>

              <button type="submit" id="btn">Create Account</button>
           </form>

            <p class="success-message" id="success-message">
            Your account has been created successfully!
        </p>
        <a href="{{ url_for('login') }}">Back To Login</a>

        </div>    
    </body>    
</html>
