<!DOCTYPE html>
<html lang="en">
<head>
    <title>Patient Data Entry - MedAnalyzer System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://thumbs.dreamstime.com/b/data-entry-shiny-blue-square-button-isolated-143172690.jpg">
    <link rel="stylesheet" href="{{ url_for('static', filename='patient_data_entry.css') }}">
    <script src="{{ url_for('static', filename='s.js') }}" defer></script>
    <script src="{{ url_for('static', filename='patient_data_entry.js') }}" defer></script>
    <script src="{{ url_for('static', filename='main.js') }}" defer></script>
     <script src="{{ url_for('static', filename='uplode.js') }}" defer></script>
</head>
<body>
    <div class="page-title">
        <h1>Enter Patient Data</h1>
    </div>
    <form id="patient-form">
        <label for="PatientID">Patient ID :</label>
        <input type="text" id="PatientID" name="PatientID" required>

        <label for="HeartRate">Heart Rate :</label>
        <input type="number" id="HeartRate" name="HeartRate" min="1" required>

        <label for="RespiratoryRate">Respiratory Rate :</label>
        <input type="number" id="RespiratoryRate" name="RespiratoryRate" min="5" max="60" required>

        <label for="Timestamp">Timestamp :</label>
        <input type="datetime-local" id="Timestamp" name="Timestamp" step="1" required>

        <label for="BodyTemperature">Body Temperature :</label>
        <input type="number" id="BodyTemperature" name="BodyTemperature" step="any" min="30" max="45" required>

        <label for="OxygenSaturation">Oxygen Saturation :</label>
        <input type="number" id="OxygenSaturation" name="OxygenSaturation" step="any" min="50" max="100" required>

        <label for="SystolicBloodPressure">Systolic Blood Pressure :</label>
        <input type="number" id="SystolicBloodPressure" name="SystolicBloodPressure" step="1" min="50" max="250" required>

        <label for="DiastolicBloodPressure">Diastolic Blood Pressure :</label>
        <input type="number" id="DiastolicBloodPressure" name="DiastolicBloodPressure" step="1" min="30" max="150" required>

        <label for="Age">Age :</label>
        <input type="number" id="Age" name="Age" step="1" min="0" max="120" required>

        <label for="Gender">Gender :</label>
        <select id="Gender" name="Gender" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <label for="Weight_kg">Weight (kg) :</label>
        <input type="number" id="Weight_kg" name="Weight_kg" step="0.01" min="1" max="300" required>

        <label for="Height_m">Height (m) :</label>
        <input type="number" id="Height_m" name="Height_m" step="0.01" min="0.3" max="2.5" required>

        <button type="button" onclick="calculateBMI()" class="btn-bmi">Calculate BMI</button>
        <button type="button" onclick="calculatePulsePressure()">Calculate Pulse Pressure</button>
        <button type="button" onclick="calculateMAP()">Calculate MAP</button>
        <button type="button" onclick="calculateHRV()">Calculate HRV</button>

        <br>

        <label for="Derived_HRV">HRV :</label>
        <input type="text" id="Derived_HRV" name="Derived_HRV" readonly>

        <label for="Derived_Pulse_Pressure">Pulse Pressure :</label>
        <input type="text" id="Derived_Pulse_Pressure" name="Derived_Pulse_Pressure" readonly>

        <label for="Derived_BMI">BMI :</label>
        <input type="text" id="Derived_BMI" name="Derived_BMI" readonly>

        <label for="Derived_MAP">MAP :</label>
        <input type="text" id="Derived_MAP" name="Derived_MAP" readonly>
        <hr>

    <div class="custom-sections">

    <div class="section">
        <label for="medicine">🧠 Currently and Previously on [Medications]:</label>
        <textarea id="medicine" name="medicine" rows="3" placeholder="Enter the name of the medicine here..."></textarea>
    </div>

    <label>📋 Patient History:</label>
<div id="patient_history_checklist" class="checkbox-list">
    <label><input type="checkbox" name="patient_history" value="Hypertension"> Hypertension</label>
    <label><input type="checkbox" name="patient_history" value="Diabetes"> Diabetes</label>
    <label><input type="checkbox" name="patient_history" value="Asthma"> Asthma</label>
    <label><input type="checkbox" name="patient_history" value="Heart Disease"> Heart Disease</label>
    <label><input type="checkbox" name="patient_history" value="Kidney Disease"> Kidney Disease</label>
    <label><input type="checkbox" name="patient_history" value="Cancer"> Cancer</label>
    <label><input type="checkbox" name="patient_history" value="COVID-19"> COVID-19</label>
    <label><input type="checkbox" name="patient_history" value="Other"> Other</label>
    <label>
        <input type="checkbox" name="patient_history" value="Other" id="other_checkbox"> Other
    </label>

    <!-- Hidden input for 'Other' text -->
    <label id="other-input-label" style="display:none;">
        Please specify:
        <input type="text" id="other_history_input" name="other_history_input">
    </label>
</div>



   </div>


        <div id="alerts"></div>
        <button type="submit" class="btn-save">Save Patient Data</button>
    </form>

    <fieldset>
        <legend>CSV/Excel file</legend>
        <input type="file" id="file-upload" name="file-upload" />
        <button type="button" onclick="uploadfile()">Upload</button>
        <p id="warningMessage" style="color: red; display: none;"></p>

    </fieldset>

    <footer class="footer">
        <p>&copy; 2025 MedAnalyzer System</p>
    </footer>
    <script>
document.addEventListener("DOMContentLoaded", function () {
    const otherCheckbox = document.getElementById("other_checkbox");
    const otherInputLabel = document.getElementById("other-input-label");

    if (otherCheckbox) {
        otherCheckbox.addEventListener("change", function () {
            otherInputLabel.style.display = this.checked ? "block" : "none";
        });
    }
});
</script>

</body>
</html>
