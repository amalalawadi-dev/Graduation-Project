<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Medical Data Platform</title>
  <script src="{{ url_for('static', filename='main.js') }}" defer></script>
  <script src="{{ url_for('static', filename='Dashboard.js') }}" defer></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='Dashboard.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<header>
  <div class="logo">MedAnalyzer System</div>
  <!-- نموذج البحث -->
<form id="search-form">
  <input type="text" id="patient_id" placeholder="Enter Patient ID" required>
  <button type="submit">Search</button>
</form>

<!-- مكان عرض نتائج المريض -->
<div id="search-result"></div>


<div id="statusMessage" style="color: red; margin-top: 10px;"></div>

  <!-- زر تسجيل الخروج باستخدام POST -->
<form action="/logout" method="POST" style="display: inline;">
  <button type="submit" class="logout-btn">Logout</button>
</form>

</header>


<main>
  <div class="card-container">
    <a href="/Doctors_page" class="card" style="background-image: url('https://i.ibb.co/Q3GRQNQV/Doctors.jpg');">Doctors platform</a>
    <a href="/patient_data_entry" class="card" style="background-image: url('https://i.ibb.co/dJbNdqwG/Analytic-data.jpg');">Patient Data Entry</a>
    <a href="/Analytics" class="card" style="background-image: url('https://i.ibb.co/G3xVqPWB/photo-2025-05-23-12-23-26.jpg');">Analytic-data</a>
    <a href="/about" class="card" style="background-image: url('https://i.ibb.co/23rxsPCk/about.jpg');">About</a>
  </div>
</main>

<footer>
  © 2025 MedAnalyzer. All rights reserved.
</footer>
<script>
    const searchForm = document.getElementById("search-form");
    const resultDiv = document.getElementById("search-result");

    if (searchForm && resultDiv) {
        searchForm.addEventListener("submit", function (e) {
            e.preventDefault();

            const PatientID = document.getElementById("patient_id").value;

            fetch("/search_patient", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({ PatientID: PatientID })
            })
            .then(response => response.json())
            .then(data => {
                console.log("📦 Response Data:", data);

                if (data.found) {
                    const latest = data.latest_info;
                    const readings = data.all_readings;
                    const medicines = data.all_medicines;
                    const histories = data.all_histories;

                    let html = `
                        <h3>🧾 Latest Patient Info</h3>
                        <ul>
                            <li><strong>PatientID:</strong> ${latest.PatientID}</li>
                            <li><strong>Age:</strong> ${latest.Age}</li>
                            <li><strong>Gender:</strong> ${latest.Gender}</li>
                            <li><strong>Weight:</strong> ${latest.Weight_kg ?? "N/A"} kg</li>
                            <li><strong>Height:</strong> ${latest.Height_m ?? "N/A"} m</li>
                            <li><strong>BMI:</strong> ${latest.Derived_BMI}</li>
                            <li><strong>MAP:</strong> ${latest.Derived_MAP}</li>
                            <li><strong>Pulse Pressure:</strong> ${latest.Derived_Pulse_Pressure}</li>
                            <li><strong>HRV:</strong> ${latest.Derived_HRV}</li>
                        </ul>

                        <h4>💊 Medicines:</h4>
                        <ul>${(medicines && medicines.length > 0) ? medicines.map(m => `<li>${m}</li>`).join('') : "<li>N/A</li>"}</ul>

                        <h4>📋 Medical History:</h4>
                        <ul>${(histories && histories.length > 0) ? histories.map(h => `<li>${h}</li>`).join('') : "<li>N/A</li>"}</ul>

                        <h4>📈 All Vital Readings:</h4>
                        <div style="max-width: 550px; overflow-x: auto; margin-top: 7px;">
                        <table border="1" style="border-collapse: collapse; width: 100%;">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Heart Rate</th>
                                    <th>Respiratory Rate</th>
                                    <th>Temperature</th>
                                    <th>Oxygen Saturation</th>
                                    <th>Systolic BP</th>
                                    <th>Diastolic BP</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${
                                    readings.map(r => `
                                        <tr>
                                            <td>${r.Timestamp}</td>
                                            <td>${r.HeartRate}</td>
                                            <td>${r.RespiratoryRate}</td>
                                            <td>${r.BodyTemperature}</td>
                                            <td>${r.OxygenSaturation}</td>
                                            <td>${r.SystolicBloodPressure}</td>
                                            <td>${r.DiastolicBloodPressure}</td>
                                        </tr>
                                    `).join('')
                                }
                            </tbody>
                        </table>
                    `;

                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">❌ No patient found with the entered ID.</p>`;
                }
            })
            .catch(error => {
                console.error("❌ Error:", error);
                resultDiv.innerHTML = `<p style="color: red;">❌ An error occurred: ${error.message}</p>`;
            });
        });
    }
</script>


</body>
</html>
