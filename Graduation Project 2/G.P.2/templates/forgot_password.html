<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='forgot_password.css') }}">
    <script src="{{ url_for('static', filename='forgot_password.js') }}" defer></script>
</head>
<body>
    <h2>Reset Your Password</h2>
    <form id="reset-form">
        <input type="email" id="email" placeholder="Enter your email" required><br>
        <input type="password" id="new_password" placeholder="Enter new password" required><br>
        <button type="submit">Reset Password</button>
    </form>

    <p id="success-message" style="display:none;"></p>
    <p>Remembered your password? <a href="{{ url_for('login') }}">Login here</a></p>
</body>
</html>
